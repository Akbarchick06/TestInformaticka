<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#140d35"><title>Компьютерный детектив — урок 7</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,system-ui,sans-serif}body{background:#140d35;color:#fff}button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid white;outline-offset:4px}.shell{min-height:100vh;padding:clamp(16px,3vw,40px);background:radial-gradient(ellipse at 10% 0%,#4d258a 0,transparent 45%),radial-gradient(ellipse at 100% 100%,#163d71 0,transparent 50%),#140d35}.wrap{max-width:1200px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;color:#e0d6fc;font-size:clamp(13px,1.5vw,18px)}.top button{border:1px solid #ffffff60;background:#ffffff22;color:#fff;font-weight:800;padding:12px 15px;border-radius:11px}.center{text-align:center;padding:clamp(35px,9vh,110px) 0 24px}.emoji{font-size:clamp(65px,10vw,100px)}h1{font-weight:950;font-size:clamp(42px,6vw,79px);letter-spacing:-.055em;line-height:1.07;margin:18px 0 24px}.sub{font-size:clamp(18px,2.4vw,26px);line-height:1.5;color:#d5cdef}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:32px}.btn{padding:17px 26px;font-size:clamp(17px,2vw,22px);font-weight:900;border:0;border-radius:14px;background:#ffdf57;color:#221a4a;border-bottom:6px solid #c7a936}.outline{background:#ffffff19;color:#fff;border:1px solid #ffffff7a}.hidden{display:none!important}.bar{height:12px;background:#ffffff38;border-radius:99px;overflow:hidden;margin:28px 0 18px}.fill{height:100%;width:0;background:#ffdc51;transition:width .25s}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:clamp(17px,2.2vw,23px);font-weight:900}.tag{background:#ffffff21;border-radius:30px;padding:10px 20px}.question{display:grid;place-items:center;text-align:center;font-weight:950;font-size:clamp(26px,4.3vw,51px);min-height:190px;line-height:1.2;padding:10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}.answer{border:0;border-bottom:7px solid #0004;border-radius:18px;min-height:137px;padding:22px;display:flex;align-items:center;gap:18px;text-align:left;color:#fff;font-weight:900;font-size:clamp(19px,2.9vw,31px)}.answer:nth-child(1){background:#df3041}.answer:nth-child(2){background:#1568ce}.answer:nth-child(3){background:#cf9a0e}.answer:nth-child(4){background:#21934d}.answer:disabled{cursor:default}.answer.dim{opacity:.35}.answer.correct{outline:5px solid #abffc9}.answer.wrong{outline:5px solid #fff}.shape{font-size:36px;min-width:45px}.footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:27px;min-height:85px}.feedback{font-size:clamp(16px,2vw,24px);font-weight:900;max-width:780px}.result{font-size:clamp(65px,12vw,132px);color:#ffe16c;font-weight:1000}.note{color:#d5cdef;font-size:15px;margin-top:25px}@media(max-width:650px){.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:70px;padding:14px 17px;font-size:19px}.question{min-height:118px}.footer{min-height:80px}.btn{font-size:16px}}
</style></head><body><div class="shell"><div class="wrap"><header class="top"><div>🕵️ КОМПЬЮТЕРНЫЙ ДЕТЕКТИВ · УРОК 7</div><button id="fullscreen">⛶ На весь экран</button></header>
<section id="home" class="center"><div class="emoji">⌨️</div><h1>ПРОВЕРЬ СВОИ<br>КОМПЬЮТЕРНЫЕ НАВЫКИ</h1><p class="sub">20 вопросов · 4 варианта · 20 секунд<br>Два раунда по 10 вопросов</p><div class="buttons"><button class="btn" id="all">Играть 20 вопросов</button><button class="btn outline" id="round1">Разминка (1–10)</button><button class="btn outline" id="round2">Финал (11–20)</button></div><p class="note">Подходит для проектора и компьютера, работает без интернета.</p></section>
<section id="game" class="hidden"><div class="bar"><div class="fill" id="progress"></div></div><div class="stats"><div id="step">Вопрос 1 из 20</div><div class="tag" id="time">⏱ 20</div><div id="points">⭐ 0 баллов</div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="footer"><div class="feedback" id="feedback" role="status" aria-live="polite">Выберите правильный ответ</div><button class="btn hidden" id="next">Далее →</button></div></section>
<section id="end" class="center hidden"><div id="award" class="emoji">🏆</div><h1>МИССИЯ ВЫПОЛНЕНА!</h1><div class="result" id="result"></div><p class="sub" id="message"></p><div class="buttons"><button class="btn" id="repeat">Играть снова ↻</button><button class="btn outline" id="menu">Меню</button></div></section></div></div>
<script>
(function(){
"use strict";
const bank=[["Какое устройство показывает изображение?",["Монитор","Клавиатура","Мышь","Колонки"],0],["Какой кнопкой мыши обычно выбирают файл?",["Правой","Левой","Колёсиком","Кнопкой питания"],1],["Для чего нужна папка?",["Для хранения файлов","Для печати текста","Для включения экрана","Для переключения языка"],0],["Какой формат обычно у файла Блокнота?",[".png",".mp3",".txt",".exe"],2],["Какое сочетание копирует выделенное?",["Ctrl + X","Ctrl + C","Ctrl + Z","Ctrl + S"],1],["Как вставить скопированный файл?",["Ctrl + V","Ctrl + C","Ctrl + A","Ctrl + S"],0],["Как вырезать файл для перемещения?",["Ctrl + C","Ctrl + A","Ctrl + X","Ctrl + S"],2],["Как отменить последнее действие?",["Ctrl + S","Alt + Tab","Win + E","Ctrl + Z"],3],["Как переключаться между окнами?",["Ctrl + Z","Alt + Tab","Ctrl + V","Ctrl + A"],1],["Как быстро открыть Проводник?",["Win + E","Ctrl + C","Shift + E","Alt + E"],0],["Как напечатать одну заглавную букву?",["Caps Lock + Ctrl","Shift + буква","Enter + буква","Ctrl + V"],1],["Что включает режим заглавных букв?",["Backspace","Enter","Caps Lock","Delete"],2],["Как перейти на новую строку в Блокноте?",["Space","Backspace","Delete","Enter"],3],["Как поставить пробел между словами?",["Space","Shift","Ctrl","Tab"],0],["Как удалить символ слева от курсора?",["Delete","Shift","Backspace","Enter"],2],["Как удалить символ справа от курсора?",["Enter","Delete","Space","Caps Lock"],1],["Как выделить весь текст?",["Ctrl + A","Ctrl + C","Ctrl + X","Ctrl + Z"],0],["Как сохранить изменения в документе?",["Ctrl + V","Alt + Tab","Ctrl + S","Ctrl + A"],2],["После копирования файла в новую папку…",["Оригинал остаётся","Оригинал удаляется","Имя файла исчезает","Папка исчезает"],0],["Как проверить, сохранился ли текст?",["Сменить язык","Удалить документ","Выключить монитор","Открыть сохранённый файл"],3]], $=id=>document.getElementById(id);
let selection=[],mode="all",index=0,score=0,right=0,time=20,timer=null,locked=false;
function show(id){["home","game","end"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function start(which){mode=which;selection=which==="first"?bank.slice(0,10):which==="second"?bank.slice(10):bank.slice();index=0;score=0;right=0;show("game");render()}
function render(){clearInterval(timer);locked=false;time=20;let q=selection[index];$("progress").style.width=((index+1)/selection.length*100)+"%";$("step").textContent="Вопрос "+(index+1)+" из "+selection.length;$("time").textContent="⏱ 20";$("points").textContent="⭐ "+score+" баллов";$("question").textContent=q[0];$("feedback").textContent="Выберите правильный ответ";$("next").classList.add("hidden");const holder=$("answers");holder.replaceChildren();q[1].forEach((a,j)=>{let button=document.createElement("button");button.className="answer";let sym=document.createElement("span");sym.className="shape";sym.textContent=["◆","■","▲","●"][j];let txt=document.createElement("span");txt.textContent=a;button.append(sym,txt);button.addEventListener("click",()=>pick(j));holder.append(button)});timer=setInterval(()=>{time--; $("time").textContent="⏱ "+time;if(time<=0)pick(-1)},1000)}
function pick(choice){if(locked)return;locked=true;clearInterval(timer);const q=selection[index];[...$("answers").children].forEach((el,j)=>{el.disabled=true;el.classList.add(j===q[2]?"correct":choice===j?"wrong":"dim")});if(choice===q[2]){right++;const got=500+time*25;score+=got;$("feedback").textContent="✅ Верно! +"+got+" баллов"}else{$("feedback").textContent=(choice<0?"⏰ Время вышло. ":"❌ Не совсем. ")+"Правильный ответ: "+q[1][q[2]]}$("points").textContent="⭐ "+score+" баллов";$("next").textContent=index===selection.length-1?"Результат →":"Следующий вопрос →";$("next").classList.remove("hidden")}
function next(){index++;if(index<selection.length){render();return}show("end");$("result").textContent=right+" / "+selection.length;let fraction=right/selection.length;$("award").textContent=fraction===1?"🏆":fraction>=.8?"🥇":fraction>=.5?"👏":"💪";$("message").textContent=fraction===1?"Идеально! Ты настоящий мастер компьютера.":fraction>=.8?"Отлично! Почти всё правильно.":fraction>=.5?"Хороший результат! Повтори несколько команд.":"Тренируйся, и у тебя всё получится!"}
$("all").addEventListener("click",()=>start("all"));$("round1").addEventListener("click",()=>start("first"));$("round2").addEventListener("click",()=>start("second"));$("next").addEventListener("click",next);$("repeat").addEventListener("click",()=>start(mode));$("menu").addEventListener("click",()=>{clearInterval(timer);show("home")});$("fullscreen").addEventListener("click",()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else{document.exitFullscreen?.().catch(()=>{})}});
document.addEventListener("keydown",e=>{if(!$("game").classList.contains("hidden")&&!locked&&["1","2","3","4"].includes(e.key)){pick(Number(e.key)-1)}else if(!$("next").classList.contains("hidden")&&e.key==="Enter"){next()}});
})();
</script></body></html>
